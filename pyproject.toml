[project]
name = "vancouver-cold-events-ml"
version = "0.1.0"
description = "Leakage-safe rare-event forecasting for Vancouver extreme cold days"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "lightgbm>=4.3,<4.7",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]
tracking = ["mlflow>=2.18,<3"]

[project.scripts]
cold-events = "cold_events.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cold_events"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
exclude-newer = "2025-06-30T23:59:59Z"
